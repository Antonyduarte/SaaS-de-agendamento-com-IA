<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#5b5ce2">
    <title>AgendaFlow — Administração</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
  </head>
  <body>
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>

    <main class="shell dashboard admin-dashboard">
      <header class="dashboard-header">
        <a class="logo" href="/"><span>✦</span> AgendaFlow</a>
        <div class="header-actions">
          <a href="/" class="outline-button">Minha agenda</a>
          <button id="logout-button" class="outline-button">Sair</button>
        </div>
      </header>

      <div class="dashboard-intro admin-intro">
        <div>
          <p class="eyebrow">ÁREA RESTRITA</p>
          <h1>Painel <em>administrativo.</em></h1>
          <p>Acompanhe todos os agendamentos e clientes em um único lugar.</p>
        </div>
        <div class="admin-summary">
          <span>AGENDAMENTOS</span>
          <strong id="total-appointments">—</strong>
          <small>Total programado</small>
        </div>
      </div>

      <section class="appointments-card admin-card">
        <div class="card-heading admin-card-heading">
          <div>
            <h2>Agenda geral</h2>
            <p id="admin-count">Carregando registros...</p>
          </div>
          <div class="admin-tools">
            <label class="search-field">
              <span>⌕</span>
              <input id="search-input" type="search" placeholder="Buscar cliente ou compromisso">
            </label>
            <button id="refresh-button" class="icon-button" title="Atualizar">↻</button>
          </div>
        </div>

        <div class="table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Data e hora</th>
                <th>Compromisso</th>
                <th>Cliente</th>
                <th>E-mail</th>
              </tr>
            </thead>
            <tbody id="admin-appointments-list"></tbody>
          </table>
        </div>
        <div id="admin-empty" class="empty-state hidden"></div>
      </section>
    </main>

    <div id="toast" class="toast" role="status"></div>
    <script src="js/admin.js"></script>
  </body>
</html>
